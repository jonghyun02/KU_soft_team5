[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sinkprep"
version = "0.1.0"
description = "영상 기준 대본(sink) 형식 통일 전처리"
requires-python = ">=3.11"
dependencies = [
  "pywin32",
  "jsonschema>=4.20",
  "pymupdf",
  "pypdf",
  "charset-normalizer",
  "rapidfuzz",
  "olefile",
  "striprtf",
  "python-docx",
  "rapidocr==3.10.0",
  "xlrd==2.0.1",
  # convert·hancom_worker(한컴 프로세스 찾기)와 ocr·media(그림·소리 배열)가 직접 쓴다
  "psutil",
  "numpy",
]

[project.optional-dependencies]
test = ["pytest"]
# 영상 받아쓰기(sinkprep asr). 결과가 버전에 달려 있어 고정한다. ffmpeg·ffprobe 는 PATH 에 따로 있어야 한다.
asr = ["faster-whisper==1.2.1", "numpy", "psutil"]
# 받아쓰기를 GPU(cuda)로 돌릴 때 필요한 cuBLAS·cuDNN DLL. asr.py 가 site-packages/nvidia/*/bin 을 DLL 경로에 더한다.
asr-gpu = ["nvidia-cublas-cu12", "nvidia-cudnn-cu12>=9,<10"]

[tool.setuptools]
packages = ["sinkprep"]

[tool.pytest.ini_options]
testpaths = ["tests"]

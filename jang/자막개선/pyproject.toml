[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mos-sdh"
version = "1.0.0"
description = "MoS-SDH Studio v1.0: 5-Stage Audio-Visual Manner of Speech Quantitative Analyzer & Interactive Barrier-Free Subtitle Studio"
readme = "MoS_배리어프리_자막_시스템_기획서.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "torch>=2.7.0",
    "torchaudio>=2.7.0",
    "torchvision>=0.22.0",
    "demucs>=4.0.0",
    "silero-vad>=5.1",
    "faster-whisper>=1.1.0",
    "nvidia-cublas-cu12>=12.4.0; sys_platform == 'win32'",
    "nvidia-cudnn-cu12>=9.1.0; sys_platform == 'win32'",
    "praat-parselmouth>=0.4.4",
    "librosa>=0.10.2",
    "soundfile>=0.12.1",
    "numpy>=1.26.0",
    "scipy>=1.13.0",
    "scikit-learn>=1.5.0",
    "kiwipiepy>=0.18.0",
    "sentencepiece>=0.2.0",
    "pysubs2>=1.7.0",
    "opencv-python-headless>=4.10.0",
    "scenedetect>=0.6.4",
    "easyocr>=1.7.1",
    "pillow>=10.4.0",
    "transformers>=4.46.0",
    "accelerate>=1.1.0",
    "bitsandbytes>=0.45.0",
    "sentence-transformers>=3.2.0",
    "qwen-vl-utils>=0.0.8",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "python-multipart>=0.0.12",
    "httpx>=0.27.0",
    "pyside6-essentials>=6.8.0",
    "pyside6-addons>=6.8.0",
    "pydantic>=2.7.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2.0",
]

[project.scripts]
mos-sdh = "mos_sdh.cli:app"

[project.gui-scripts]
mos-sdh-studio = "mos_sdh.desktop.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mos_sdh"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]
torchaudio = [
    { index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]
torchvision = [
    { index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

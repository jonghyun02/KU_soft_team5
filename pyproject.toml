[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sinkprep"
version = "0.1.0"
description = "영상 기준 대본(sink) 형식 통일 전처리"
requires-python = ">=3.11"
dependencies = [
  "pywin32",
  "jsonschema>=4.20",
  "pymupdf",
  "pypdf",
  "charset-normalizer",
  "rapidfuzz",
  "olefile",
  "striprtf",
  "python-docx",
  "rapidocr==3.10.0",
  "xlrd==2.0.1",
]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools]
packages = ["sinkprep"]

[tool.pytest.ini_options]
testpaths = ["tests"]
